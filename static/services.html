<!DOCTYPE html>
<html lang="en" class="bg-gray-50 text-gray-800">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Services | Happy Paws</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            orange: '#F97316',
                            blue: '#0EA5E9',
                            dark: '#1F2937',
                            light: '#F9FAFB'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <!-- Navbar -->
    <header class="bg-white shadow-sm sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2 cursor-pointer" onclick="window.location.href='/adopt'">
                <div class="w-8 h-8 rounded-full bg-brand-orange flex items-center justify-center text-white">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                </div>
                <span class="text-xl font-bold text-brand-dark tracking-tight">Happy Paws</span>
            </div>
            <nav class="hidden md:flex gap-6">
                <a href="/adopt" class="text-gray-500 hover:text-brand-dark font-medium px-1 py-5 transition-colors">Adopt a Pet</a>
                <a href="/care" class="text-gray-500 hover:text-brand-dark font-medium px-1 py-5 transition-colors">Pet Care</a>
                <a href="/services" class="text-brand-orange font-semibold border-b-2 border-brand-orange px-1 py-5">Services</a>
            </nav>
            <div class="flex items-center">
                <button onclick="window.location.href='/adopt'" class="bg-brand-blue hover:bg-blue-600 text-white px-5 py-2 rounded-md font-medium transition-colors shadow-sm">
                    Back to Adopt
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 w-full py-12">
        <h1 class="text-3xl font-bold text-gray-900 mb-6">Our Services</h1>
        <p class="text-gray-600 mb-8">Professional services for your companion.</p>
    </main>
</body>
</html>
